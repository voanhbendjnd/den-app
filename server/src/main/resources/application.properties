spring.application.name=denhub-server
server.port=${SERVER_PORT:8080}

# Microsoft SQL Server Configuration
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=denhubdb;encrypt=false;trustServerCertificate=true}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:123456}
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Web Console Disabled
spring.h2.console.enabled=false

# Cache
spring.cache.type=none

# DenHub JWT Properties
denhub.app.name=denhub
denhub.jwt.base64-secret=${JWT_BASE64_SECRET:dGhpcy1pcy1hLXNhbXBsZS1iYXNlNjQtc2VjcmV0LWtleS1mb3ItZGVuaHViLXRlc3RpbmctcHVycG9zZXMtb25seS12ZXJ5LXNlY3VyZQ==}
denhub.jwt.access-token-validity-in-seconds=${JWT_ACCESS_TOKEN_VALIDITY:86400}
denhub.jwt.refresh-token-validity-in-seconds=${JWT_REFRESH_TOKEN_VALIDITY:604800}

# Client Base URL
denhub.client.base-url=${CLIENT_BASE_URL:http://localhost:5173}
denhub.client.allow-localhost=${CLIENT_ALLOW_LOCALHOST:true}

spring.data.web.pageable.one-indexed-parameters=true

## Config email with Gmail (fallback configured)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:voanhbendjnd@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:qszvkqqlsdpaupja}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Multipart File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
denhub.upload-file.base-uri=${UPLOAD_FILE_BASE_URI:C:/Users/PC/Documents/project/upload/den-hub/files}

spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=true

# Initial Admin Account
denhub.init-admin.email=${INIT_ADMIN_EMAIL:admin@denhub.local}
denhub.init-admin.password=${INIT_ADMIN_PASSWORD:}
