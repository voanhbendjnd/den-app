spring.application.name=denhub-server
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Cache
spring.cache.type=none

# Security & App properties
denhub.app.name=denhub
denhub.jwt.base64-secret=dGhpcy1pcy1hLXNhbXBsZS1iYXNlNjQtc2VjcmV0LWtleS1mb3ItZGVuaHViLXRlc3RpbmctcHVycG9zZXMtb25seS12ZXJ5LXNlY3VyZQ==
denhub.jwt.access-token-validity-in-seconds=3600
denhub.jwt.refresh-token-validity-in-seconds=86400
denhub.client.base-url=http://localhost:3000
denhub.client.allow-localhost=true

# Upload file properties
denhub.upload-file.base-uri=target/test-uploads/

# Mail
spring.mail.host=localhost
spring.mail.port=25

