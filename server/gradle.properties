# Gradle JVM memory settings
# Configured to prevent Out of Memory crashes and limit RAM usage
org.gradle.jvmargs=-Xms256m -Xmx768m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC -Dfile.encoding=UTF-8

# Limit worker count to avoid spawning 16 parallel processes on 16-core CPU
org.gradle.workers.max=2

# Terminate idle daemons quickly to release memory (1 minute)
org.gradle.daemon.idletimeout=60000
