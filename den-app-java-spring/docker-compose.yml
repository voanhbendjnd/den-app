services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-den-app-local
    restart: always
    environment:
      MYSQL_DATABASE: den-app
      MYSQL_ROOT_PASSWORD: 1607
    ports:
      - "3307:3306"
    volumes:
      - "./mysql_data:/var/lib/mysql"
  redis-happy-farm:
    image: redis:alpine
    container_name: den-app-local
    restart: always
    ports:
      - "6379:6379"